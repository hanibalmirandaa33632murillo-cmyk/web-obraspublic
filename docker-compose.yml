

# ── docker-compose.yml ──────────────────────────────────────────────────────
# Levanta PostgreSQL + pgAdmin + Backend FastAPI en local.
# Uso: docker compose up -d
# ───────────────────────────────────────────────────────────────────────────

services:

  # ── Base de datos PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: obras_db
    environment:
      POSTGRES_DB: obras_publicas
      POSTGRES_USER: obras_user
      POSTGRES_PASSWORD: obras_pass
    ports:
      - "5432:5432"          # accesible en localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql  # carga DDL + datos al iniciar
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras_user -d obras_publicas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (gestor visual de la BD) ──────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: obras_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@obras.mx
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"            # abre http://localhost:5050 en el navegador
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obras_backend
    environment:
      DATABASE_URL: postgresql://obras_user:obras_pass@postgres:5432/obras_publicas
    ports:
      - "8000:8000"          # API en http://localhost:8000
      # Documentacion automatica: http://localhost:8000/docs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app       # hot-reload en desarrollo

volumes:
  postgres_data:
