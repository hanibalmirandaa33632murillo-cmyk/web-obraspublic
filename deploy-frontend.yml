name: Deploy Frontend a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          # ==============================================================
          # IMPORTANTE: Agrega este Secret en tu repo de GitHub:
          #   Settings → Secrets and variables → Actions → New repository secret
          #   Nombre: VITE_API_URL
          #   Valor:  tu URL de Railway, ej: https://web-obraspublic-production.up.railway.app
          #           La encuentras en Railway → servicio backend → Settings → Public Networking
          # ==============================================================
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
