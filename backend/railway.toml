# railway.toml — configuracion del backend en Railway
# Este archivo va en la carpeta backend/

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variables de entorno que debes configurar en Railway:
# (Railway → tu proyecto → Variables)
#
# DATABASE_URL    → se genera automatico al agregar el plugin PostgreSQL
#                   lo encuentras en: PostgreSQL service → Connect → DATABASE_URL
#
# SECRET_KEY      → genera una con: python -c "import secrets; print(secrets.token_hex(32))"
#
# ALGORITHM       → HS256
#
# ACCESS_TOKEN_EXPIRE_MINUTES → 60
